# Hai database cho LibAssist. Bật cái nào tuỳ DB_DIALECT trong code/.env.
#
#   docker compose up -d postgres     # nhánh PostgreSQL
#   docker compose up -d sqlserver    # nhánh SQL Server
#
# Không bắt buộc dùng Docker: PostgreSQL cài qua Homebrew hay SQL Server cài thẳng trên
# Windows đều chạy được, chỉ cần sửa DATABASE_URL / MSSQL_* trong .env cho khớp.

services:
  postgres:
    image: postgres:16
    container_name: libassist-postgres
    environment:
      POSTGRES_USER: libassist
      POSTGRES_PASSWORD: libassist
      POSTGRES_DB: libassist
      # Sắp xếp và so sánh chuỗi theo UTF-8. Dữ liệu là tiếng Việt có dấu.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U libassist']
      interval: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: libassist-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'LibAssist!2026'
      MSSQL_PID: Developer
    ports:
      - '1433:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    # Ảnh mssql chỉ có bản linux/amd64. Trên Mac Apple Silicon phải bật Rosetta trong
    # Docker Desktop → Settings → General → "Use Rosetta for x86_64/amd64 emulation",
    # nếu không container sẽ khởi động rồi tắt ngay.
    platform: linux/amd64
    # SQL Server không tự tạo database. Sau khi container chạy:
    #   docker exec -it libassist-sqlserver /opt/mssql-tools18/bin/sqlcmd \
    #     -S localhost -U sa -P 'LibAssist!2026' -C -Q "CREATE DATABASE libassist"

volumes:
  postgres-data:
  sqlserver-data:
